name: SIGNALCORE design validation

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - data/**
      - docs/**
      - scripts/**
      - tests/**
      - .github/workflows/**
  push:
    branches:
      - main
      - design/signalcore-profile-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Validate snapshot, links and SVGs
        run: python scripts/validate_profile.py
      - name: Test CI status semantics
        run: python -m unittest discover -s tests -v
      - name: Generate brand assets and confirm reproducibility
        run: |
          python scripts/generate_brand_assets.py
          git diff --exit-code -- assets/brand assets/cards assets/fallback
      - name: Confirm still contribution images derive from checked-in public graph
        run: |
          python scripts/prepare_static_contribution.py
          git diff --exit-code -- assets/preview/contribution-static-dark.svg assets/preview/contribution-static-light.svg
