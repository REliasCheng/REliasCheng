name: SIGNALCORE design validation

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - data/**
      - docs/**
      - scripts/**
      - tests/**
      - .github/workflows/**
  push:
    branches:
      - design/signalcore-profile-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate snapshot, links and SVGs
        run: python scripts/validate_profile.py
      - name: Test CI status semantics
        run: python -m unittest discover -s tests -v
      - name: Generate brand assets and confirm reproducibility
        run: |
          python scripts/generate_brand_assets.py
          git diff --exit-code -- assets/brand assets/cards assets/fallback
