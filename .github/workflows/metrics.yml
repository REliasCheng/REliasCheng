name: SIGNALCORE public metrics preview

on:
  push:
    branches:
      - design/signalcore-profile-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Generate dated snapshot from public GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_metrics.py --output-dir dist
      - name: Validate generated XML
        run: python scripts/validate_metrics.py dist
      - name: Upload preview only; do not publish or commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signalcore-metrics-preview
          path: |
            dist/telemetry-*.svg
            dist/telemetry.json
          if-no-files-found: error
          retention-days: 14
