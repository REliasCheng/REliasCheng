name: SIGNALCORE contribution preview

on:
  push:
    branches:
      - design/signalcore-profile-preview
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate from actual REliasCheng contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: REliasCheng
          outputs: |
            dist/snake-dark.svg?color_snake=%2361DCE6&color_dots=%230B111B,%23142435,%2325394C,%231F9DA8,%2367D9C5
            dist/snake-light.svg?color_snake=%23087F95&color_dots=%23F5F8FC,%23D0DFEA,%239BC8D4,%233A9FAF,%23087F95
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reject absent or unsafe SVG output
        run: python scripts/validate_snake.py dist
      - name: Upload preview only; do not publish or commit
        uses: actions/upload-artifact@v7
        with:
          name: signalcore-snake-preview
          path: dist/snake-*.svg
          if-no-files-found: error
          retention-days: 14
