<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SIGNALCORE portfolio terminal</title>
  <desc id="desc">A staged whoami and portfolio command sequence introducing original software, host tests and architecture studies; these are not hardware status messages.</desc>

  <rect width="1200" height="360" rx="14" fill="#FFFFFF" stroke="#D0DFEA" stroke-width="2"/>
  <path d="M0 45H1200" stroke="#D0DFEA"/><circle cx="27" cy="22" r="5" fill="#087F95"/><circle cx="47" cy="22" r="5" fill="#2563EB"/><circle cx="67" cy="22" r="5" fill="#526B80"/>
  <text x="94" y="28" fill="#3A536B" font-family="Consolas, ui-monospace, monospace" font-size="15">signalcore / portfolio interface</text>
  <path d="M29 173H775M29 305H775" stroke="#D0DFEA" stroke-width="1"/>
  <path d="M865 94H928L949 117H1128M865 272H928L949 249H1128" fill="none" stroke="#D0DFEA" stroke-width="2"/>
  <path d="M935 133H1082V200H1040V218H984V200H935Z" fill="none" stroke="#087F95" stroke-width="2"/>
  <path d="M954 165H977V150H1001V183H1026V165H1061" fill="none" stroke="#087F95" stroke-width="2"/>
  <text x="952" y="245" fill="#526B80" font-family="Consolas, ui-monospace, monospace" font-size="13" letter-spacing="2">CORE / HOST</text>
  <g font-family="Consolas, ui-monospace, monospace" font-size="19">
    <text x="34" y="90" fill="#087F95">signalcore@elias:~$ whoami</text><text x="34" y="122" fill="#102033">Elias Cheng</text><text x="34" y="152" fill="#3A536B">Embedded systems / firmware / low-level software</text><text x="34" y="198" fill="#087F95">signalcore@elias:~$ load --portfolio</text><text x="34" y="232" fill="#102033">[CODE] Original host software</text><text x="34" y="260" fill="#0F765E">[CHECK] Host-side tests on implemented work</text><text x="34" y="288" fill="#3A536B">[STUDY] MCU / RTOS / system architecture</text><text x="34" y="325" fill="#087F95">signalcore@elias:~$</text>
    <rect x="288" y="307" width="10" height="22" fill="#087F95"/>
  </g>
</svg>
