<text x="29" y="39" fill="#61DCE6" font-family="Consolas, ui-monospace, monospace" font-size="23">8051 / RESOURCE PLANNER</text>
<text x="29" y="82" fill="#F0F6FF" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="650">Shared pins, explicit conflict</text>
<path d="M29 103H611" stroke="#25394C"/>
<text x="29" y="140" fill="#A9BDCD" font-family="Consolas, ui-monospace, monospace" font-size="24">UART   P3.0 / P3.1 + T1</text>
